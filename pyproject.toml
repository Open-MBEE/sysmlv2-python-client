[project]
name = "sysml-api-client"
dynamic = ["version"]
description = "Python client for the OMG Systems Modeling API and Services"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["requests>=2.28,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Open-MBEE/sysmlv2-python-client"
Issues = "https://github.com/Open-MBEE/sysmlv2-python-client/issues"
Specification = "https://www.omg.org/spec/SystemsModelingAPI"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "requests-mock>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sysmlv2_client*", "sysml_api*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "sysmlv2_client.__version__"}

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"
